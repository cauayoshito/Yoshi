# Deploy no Render (https://render.com) — blueprint
# O banco é Postgres (Supabase): preencha DATABASE_URL ao criar.
services:
  - type: web
    name: yoshibet
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: cauayoshito1@gmail.com
      - key: PIX_DEMO_AUTOCONFIRM_MS
        value: "4000"
